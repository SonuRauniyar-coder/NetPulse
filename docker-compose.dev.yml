# Development: only Postgres runs here. Run the backend and frontend natively for hot reload:
#   cd backend  && ./mvnw spring-boot:run
#   cd frontend && npm run dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netpulse
      POSTGRES_USER: netpulse
      POSTGRES_PASSWORD: netpulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netpulse -d netpulse"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata-dev:
