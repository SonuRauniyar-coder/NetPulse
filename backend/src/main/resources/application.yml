spring:
  application:
    name: netpulse
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true          # Tomcat request threads + @Scheduled run on virtual threads (Java 21)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/netpulse}
    username: ${DB_USERNAME:netpulse}
    password: ${DB_PASSWORD:netpulse}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate     # Flyway owns the schema; Hibernate only verifies it
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: NetPulse
    version: '@project.version@'

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

netpulse:
  demo-mode: false
  security:
    jwt-secret: ${JWT_SECRET:}                 # >= 32 bytes; required
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
    cookie-secure: ${COOKIE_SECURE:true}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
    login-max-attempts: 5
    login-lockout: 15m
    login-rate-limit-per-minute: 10
    admin-username: ${ADMIN_USERNAME:}
    admin-password: ${ADMIN_PASSWORD:}
  monitoring:
    enabled: true
    max-concurrent-checks: ${MAX_CONCURRENT_CHECKS:32}
    dispatch-batch-size: 200
    default-interval-seconds: 60
    ping-count: 4
    ping-reply-timeout: 2s
    tcp-connect-timeout: 3s
    dns-timeout: 3s
    cycle-timeout: 20s
    thresholds:
      degraded-rtt-ms: 150
      degraded-loss-pct: 10
      down-after-failures: 3
      up-after-successes: 2
  retention:
    raw-days: 7
    rollup-days: 90
    delete-batch-size: 5000
