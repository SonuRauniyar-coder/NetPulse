# Local development: backend runs natively (mvn spring-boot:run), Postgres from docker-compose.dev.yml.
netpulse:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    cookie-secure: false            # http://localhost has no TLS
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:NetPulse-Dev-2026!}
logging:
  level:
    com.netpulse: DEBUG
